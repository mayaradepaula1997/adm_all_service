spring.application.name=adm_all_service
server.port=8080

# --- Banco de Dados PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adm_all_service}
spring.datasource.username=${DB_USERNAME:admallservice}
spring.datasource.password=${DB_PASSWORD:admallservice123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# --- JWT Secret ---
jwt.secret=${JWT_SECRET:adm-all-service-secret-key-2024-production}
jwt.expiration.hours=8

# --- CORS ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://allserviceweb.netlify.app}

# --- Swagger / SpringDoc ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# --- Logging ---
logging.level.com.project.adm_all_service=INFO