spring.application.name=adm_all_service
server.port=${PORT}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration.hours=8

cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://allserviceweb.netlify.app}

logging.level.com.project.adm_all_service=INFO
