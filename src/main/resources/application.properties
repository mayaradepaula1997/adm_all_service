spring.application.name=adm_all_service
server.port=${PORT}

# --- Banco de Dados PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}
spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT Secret ---
jwt.secret=${JWT_SECRET}
jwt.expiration.hours=8

# --- CORS ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://allserviceweb.netlify.app}

# --- Logging ---
logging.level.com.project.adm_all_service=INFO
