version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: adm_all_service_db
    restart: always
    environment:
      POSTGRES_DB: adm_all_service
      POSTGRES_USER: admallservice
      POSTGRES_PASSWORD: admallservice123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
